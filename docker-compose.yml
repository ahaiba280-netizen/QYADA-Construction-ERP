version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qyada_postgres
    environment:
      POSTGRES_USER: qyada
      POSTGRES_PASSWORD: qyada123
      POSTGRES_DB: qyada_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qyada_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qyada"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: qyada_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qyada_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qyada_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://qyada:qyada123@postgres:5432/qyada_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-secret-key
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qyada_network
    command: npm run dev

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qyada_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WEBSOCKET_URL: ws://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - qyada_network
    command: npm start

volumes:
  postgres_data:
  redis_data:

networks:
  qyada_network:
    driver: bridge
